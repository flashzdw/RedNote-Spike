<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆能器爆炸范围测算</title>
<style>
  :root {
    --bg: #0f1923;
    --bg2: #0b1118;
    --line: #1e2c3a;
    --text: #ece8e1;
    --muted: #8fa0b0;
    --red: #ff4655;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.55 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .top {
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--bg2);
  }
  .top h1 { font-size: 16px; font-weight: 900; letter-spacing: 1px; }

  .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--bg2);
  }
  .chip {
    cursor: pointer; padding: 4px 10px; border: 1px solid var(--line); background: transparent;
    color: var(--text); font-weight: 700; font-size: 12px; letter-spacing: 1px;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--red); border-color: var(--red); color: #fff; }

  main { padding: 16px 18px 20px; max-width: 1280px; margin: 0 auto; }

  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .hint { font-size: 12px; color: var(--muted); }
  .hint strong { color: var(--red); }

  .actions { display: flex; gap: 8px; margin-left: auto; }
  .btn {
    cursor: pointer; padding: 7px 14px; border: 1px solid var(--red); background: var(--red);
    color: #fff; font-weight: 800; font-size: 12px; letter-spacing: 2px;
  }
  .btn:hover { background: #ff5a68; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn.ghost:hover { border-color: var(--muted); }

  .stage {
    position: relative; border: 1px solid var(--line); background: var(--bg2);
    overflow: hidden; line-height: 0;
  }
  svg.map { display: block; width: 100%; height: auto; }

  .zone-poly {
    fill: rgba(255, 200, 60, 0.10);
    stroke: rgba(255, 200, 60, 0.9);
    stroke-width: 1.5; stroke-dasharray: 4 3;
    cursor: crosshair; transition: fill .15s;
  }
  .zone-poly:hover { fill: rgba(255, 200, 60, 0.30); }

  .explode-fill { fill: rgba(0,0,0,0.5); }
  .explode-ring { fill: none; stroke: var(--red); stroke-width: 2.5; }
  .ring { fill: none; stroke: var(--red); stroke-width: 1.5; }
  .radius-line { stroke: #fff; stroke-width: 1.4; stroke-dasharray: 4 3; }
  .radius-label {
    fill: var(--red); font-weight: 900; paint-order: stroke;
    stroke: rgba(0,0,0,0.7); stroke-width: 3;
  }
  .scale-line, .scale-tick { stroke: rgba(255,255,255,0.7); }
  .scale-line { stroke-width: 1.4; }
  .scale-tick { stroke-width: 1.2; }
  .scale-label { fill: rgba(255,255,255,0.85); font-weight: 700; }
</style>
</head>
<body>

<header class="top">
  <h1>爆能器爆炸范围测算</h1>
</header>

<div class="chips" id="mapChips"></div>

<main>
  <div class="bar">
    <span class="hint" id="hint">在下方地图的 <strong>黄色包点区域</strong>内任意位置点击选择下包点</span>
    <div class="actions">
      <button class="btn" id="btnSim" disabled>模拟爆炸</button>
      <button class="btn ghost" id="btnReset">重置</button>
    </div>
  </div>

  <div class="stage">
    <svg class="map" id="map"></svg>
  </div>
</main>

<script>
"use strict";

function polyStr(arr){ return arr.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); }
function inPoly(px, py, poly) {
  let inside = false;
  for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi) + xi)) inside = !inside;
  }
  return inside;
}

const BLAST_R = 35;

const MAPS = [
  { id:"ascent",   zh:"亚海悬城", W:1900, H:1780, worldW:92, img:"{{IMG_ascent}}",   sites:{{SITES_ascent}} },
  { id:"bind",     zh:"源工重镇", W:1838, H:1937, worldW:92, img:"{{IMG_bind}}",     sites:{{SITES_bind}} },
  { id:"split",    zh:"霓虹町",   W:1788, H:1901, worldW:82, img:"{{IMG_split}}",    sites:{{SITES_split}} },
  { id:"haven",    zh:"隐世修所", W:1913, H:1717, worldW:130,img:"{{IMG_haven}}",    sites:{{SITES_haven}} },
  { id:"icebox",   zh:"极地寒港", W:1920, H:1694, worldW:112,img:"{{IMG_icebox}}",   sites:{{SITES_icebox}} },
  { id:"breeze",   zh:"微风岛屿", W:960,  H:942,  worldW:150,img:"{{IMG_breeze}}",   sites:{{SITES_breeze}} },
  { id:"fracture", zh:"裂变峡谷", W:1850, H:1762, worldW:120,img:"{{IMG_fracture}}", sites:{{SITES_fracture}} },
  { id:"pearl",    zh:"深海明珠", W:1016, H:950,  worldW:105,img:"{{IMG_pearl}}",    sites:{{SITES_pearl}} },
  { id:"lotus",    zh:"莲华古城", W:898,  H:798,  worldW:140,img:"{{IMG_lotus}}",    sites:{{SITES_lotus}} },
  { id:"sunset",   zh:"日落之城", W:1897, H:2006, worldW:95, img:"{{IMG_sunset}}",   sites:{{SITES_sunset}} },
  { id:"abyss",    zh:"深渊",     W:962,  H:997,  worldW:118,img:"{{IMG_abyss}}",    sites:{{SITES_abyss}} },
  { id:"corrode",  zh:"盐海矿镇", W:1953, H:1724, worldW:100,img:"{{IMG_corrode}}",  sites:{{SITES_corrode}} },
  { id:"summit",   zh:"天枢云阙", W:1962, H:1976, worldW:98, img:"{{IMG_summit}}",   sites:{{SITES_summit}} },
];

const svg = document.getElementById("map");
const chipsWrap = document.getElementById("mapChips");
const hintEl = document.getElementById("hint");
const btnSim = document.getElementById("btnSim");
const btnReset = document.getElementById("btnReset");

const state = {
  map: MAPS[0],
  plant: null,    // {x,y} 像素坐标（任意包点内）
  phase: "idle",  // idle | anim | done
  t0: 0,
  raf: 0,
};

function buildChips() {
  chipsWrap.innerHTML = "";
  MAPS.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = m.zh;
    b.addEventListener("click", () => selectMap(i));
    chipsWrap.appendChild(b);
  });
}
function refreshChips() {
  [...chipsWrap.children].forEach((el, i) => el.classList.toggle("on", i === MAPS.indexOf(state.map)));
}
function selectMap(i) {
  cancelSim();
  state.map = MAPS[i];
  state.plant = null;
  state.phase = "idle";
  refreshChips();
  hintEl.innerHTML = '在下方地图的 <strong>黄色包点区域</strong>内任意位置点击选择下包点';
  btnSim.disabled = true;
  draw();
}
function cancelSim() {
  if (state.raf) { cancelAnimationFrame(state.raf); state.raf = 0; }
  state.phase = "idle";
}

btnSim.addEventListener("click", () => {
  if (!state.plant) return;
  startSim();
});
btnReset.addEventListener("click", () => {
  cancelSim();
  state.plant = null;
  state.phase = "idle";
  hintEl.innerHTML = '在下方地图的 <strong>黄色包点区域</strong>内任意位置点击选择下包点';
  btnSim.disabled = true;
  draw();
});

function startSim() {
  cancelSim();
  state.phase = "anim";
  state.t0 = performance.now();
  state.raf = requestAnimationFrame(tick);
}
function tick(now) {
  const t = now - state.t0;
  if (t < 1200) {                 // 充能 0.8s
    state.raf = requestAnimationFrame(tick);
  } else {
    state.phase = "done";
    state.raf = 0;
    hintEl.innerHTML = '爆炸完成 · <strong>35m</strong> 半径 · <strong>999</strong> 即死';
  }
  draw();
}

function sitePolyPx(s, m){ return s.poly_n.map(p => [p[0]*m.W, p[1]*m.H]); }

function draw() {
  const m = state.map;
  const W = m.W, H = m.H;
  const mpp = m.W / m.worldW;
  const blastPx = BLAST_R / mpp;

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  let s = "";
  s += '<image href="'+m.img+'" x="0" y="0" width="'+W+'" height="'+H+'"/>';

  // 包点（多边形）
  m.sites.forEach(site => {
    s += '<polygon class="zone-poly" vector-effect="non-scaling-stroke" points="'+polyStr(sitePolyPx(site, m))+'"/>';
  });

  // 下包点（红色三角 + 充能圈）
  if (state.plant) {
    const p = state.plant;
    const sz = Math.min(W, H) * 0.02;
    s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(sz*3.2)+'" fill="rgba(255,70,85,0.25)"/>'
       + '<polygon transform="translate('+p.x+','+p.y+')" points="0,'+(-sz)+' '+(-sz*0.82)+','+(sz*0.74)+' '+(sz*0.82)+','+(sz*0.74)+'" fill="#ff4655" stroke="#fff" stroke-width="0.5" vector-effect="non-scaling-stroke"/>';

    if (state.phase === "anim") {
      const t = performance.now() - state.t0;
      const k = Math.min(1, t / 800);
      const r = k * (sz*4);  // 充能圈
      s += '<circle class="ring" cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" vector-effect="non-scaling-stroke"/>';
    }
    if (state.phase === "done") s += doneMarkup(p, m, blastPx);
  }

  s += scaleBar(m, mpp);
  svg.innerHTML = s;
}

function doneMarkup(p, m, blastPx) {
  let s = '<circle class="explode-fill" cx="'+p.x+'" cy="'+p.y+'" r="'+blastPx+'"/>'
        + '<circle class="explode-ring" vector-effect="non-scaling-stroke" cx="'+p.x+'" cy="'+p.y+'" r="'+blastPx+'"/>';
  const dirs = [[0,-1],[0,1],[1,0],[-1,0]];
  let dir = [1,0];
  for (const d of dirs) {
    const ex = p.x+d[0]*blastPx, ey = p.y+d[1]*blastPx;
    if (ex>10 && ex<m.W-10 && ey>10 && ey<m.H-10) { dir = d; break; }
  }
  const ex = p.x+dir[0]*blastPx, ey = p.y+dir[1]*blastPx;
  s += '<line class="radius-line" vector-effect="non-scaling-stroke" x1="'+p.x+'" y1="'+p.y+'" x2="'+ex+'" y2="'+ey+'"/>';
  const lx = p.x+dir[0]*blastPx*0.5, ly = p.y+dir[1]*blastPx*0.5;
  const fs = Math.min(m.W, m.H) * 0.027;
  s += '<text class="radius-label" x="'+lx+'" y="'+ly+'" font-size="'+fs+'" text-anchor="middle">35m</text>';
  return s;
}

function scaleBar(m, mpp) {
  const meters = 20;
  const len = meters / mpp;
  const mini = Math.min(m.W, m.H);
  const y = m.H - mini*0.05;
  const x0 = mini*0.04, x1 = x0 + len;
  const fs = mini*0.022;
  return '<line class="scale-line" vector-effect="non-scaling-stroke" x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/>'
    + '<line class="scale-tick" vector-effect="non-scaling-stroke" x1="'+x0+'" y1="'+(y-mini*0.006)+'" x2="'+x0+'" y2="'+(y+mini*0.006)+'"/>'
    + '<line class="scale-tick" vector-effect="non-scaling-stroke" x1="'+x1+'" y1="'+(y-mini*0.006)+'" x2="'+x1+'" y2="'+(y+mini*0.006)+'"/>'
    + '<text class="scale-label" x="'+((x0+x1)/2)+'" y="'+(y-mini*0.012)+'" font-size="'+fs+'" text-anchor="middle">'+meters+'m</text>';
}

/* ===== 点击包点任意位置下包 ===== */
svg.addEventListener("click", (e) => {
  if (state.phase === "anim") return;
  const m = state.map;
  const rect = svg.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * m.W;
  const y = (e.clientY - rect.top) / rect.height * m.H;
  // 命中任意包点？
  let hit = false;
  for (const site of m.sites) {
    if (inPoly(x, y, sitePolyPx(site, m))) { hit = true; break; }
  }
  if (!hit) {
    hintEl.innerHTML = '请在 <strong>黄色包点区域</strong>内点击';
    return;
  }
  state.plant = { x, y };
  state.phase = "idle";
  btnSim.disabled = false;
  hintEl.innerHTML = '已选下包点 · 点击 <strong>模拟爆炸</strong> 查看 35m 范围';
  draw();
});

/* ===== 启动 ===== */
buildChips();
selectMap(0);
</script>
</body>
</html>
